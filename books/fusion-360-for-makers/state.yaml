  text: 主动带学第一小课（基于前言 Types of Modeling 的实体建模介绍，例子由教师设计）：先理解草图到实体。做一块长60 mm、宽20 mm、厚3
    mm的小挂牌：先在平面上画60×20 mm的封闭矩形，这是二维草图，有长宽，没有厚度；再沿垂直于草图的方向拉伸3 mm，得到有体积的实体。在牌面画圆并作贯穿切除，就能得到挂绳孔。草图表达轮廓，拉伸赋予厚度，切除移走材料。此轮只提供讲解，尚未观察软件操作或收到学习表现；下一步确认Fusion安装/打开状态，再引导实际操作。用户原话偏好：开始吧，你引导我去学习，不是我看了来问你。
